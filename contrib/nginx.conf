# nginx site for filedrop. Put TLS in front (e.g. `certbot --nginx -d drop.example.com`).
server {
    server_name drop.example.com;

    # Link URLs carry the secret token, so don't write them to the access log.
    # filedrop logs each request itself with only the first 8 characters of the token's hash.
    access_log off;

    # Stream transfers straight through: no upload size cap, no buffering to local disk
    # in either direction, generous timeouts for slow connections.
    client_max_body_size 0;
    client_body_timeout 5m;

    # /u/ upload links, /d/ download links
    location ~ ^/[ud]/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx already answered the client's "Expect: 100-continue"
        proxy_set_header Expect "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }

    listen 80;
}
